parameters:
  - name: deploymentType
    type: string
  - name: environmentName
    type: string
  - name: subscriptionName
    type: string

stages:
  - stage: ${{ parameters.region.regionName }}_${{ parameters.environmentName }}
    dependsOn: ${{ parameters.region.runAfter }}
    displayName: "Deploy to ${{ parameters.environmentName }} (${{ variables['Build.SourceBranch'] }}) Stage"
    jobs:
        - template: ../jobs/provision-sql-server.yml
          parameters:
            deploymentType: ${{ parameters.deploymentType }}
            environmentName: ${{ parameters.environmentName }}
            subscriptionName: ${{ parameters.subscriptionName }}
            runAfter: []